# Workload "ts": microsoft/TypeScript@v6.0.3 (050880ce59e30b356b686bd3144efe24f875ebc8)
# Adapted from upstream .github/workflows/ci.yml, job "Test Node 24 on ubuntu-latest". Changes from upstream are marked "PORTABILITY" and are
# identical for every provider. See suite/ts/README.md.
name: wl-ts
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: runs-on label of the provider under test
        type: string
        required: true
      tag:
        description: run identifier assigned by the harness (shown as the run name)
        type: string
        required: true
      split:
        description: Track B only - run the test step through vitko-inc/split-tests (on other runners it runs all tests in one part)
        type: boolean
        default: false
      checkpoint:
        description: Track B only - add the checkpoint step (warm starts) after the setup steps
        type: boolean
        default: false
      accel:
        description: Provider-recommended accelerator to enable (for example runson, blacksmith); empty for none
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    name: TypeScript test (Node 24)
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    steps:
      - name: rb-probe
        shell: bash
        run: |
          m=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
          case "$m" in *EPYC*) fam="AMD EPYC";; *Ryzen*) fam="AMD Ryzen";; *Xeon*|*XEON*) fam="Intel Xeon";; *Intel*) fam="Intel";; *AMD*) fam="AMD";; *) fam="other";; esac
          ghz=$(awk -F: '/cpu MHz/{printf "%.1f", $2/1000; exit}' /proc/cpuinfo)
          echo "rb-probe cpu=\"$fam\" ghz=${ghz:-unknown} nproc=$(nproc) mem_kib=$(awk '/MemTotal/{print $2}' /proc/meminfo) swap_kib=$(awk '/SwapTotal/{print $2}' /proc/meminfo)"
      # Provider accelerator (RunsOn): its documented S3-backed cache sidecar. Runs only when asked.
      - name: RunsOn cache sidecar
        if: ${{ inputs.accel == 'runson' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: 050880ce59e30b356b686bd3144efe24f875ebc8 # v6.0.3
          persist-credentials: false
      - name: Use node version 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          check-latest: true
      - run: npm ci
      # Track B (warm starts): save the setup above from runs of the default branch; later jobs start
      # with it in place. On other runners, and when the input is off, nothing happens.
      - name: Checkpoint (warm starts)
        if: ${{ inputs.checkpoint }}
        uses: vitko-inc/checkpoint@a06aa88487d9cae4dee4eb50efffb8924ca99e78 # v1.0.3
      # PORTABILITY (all providers): build the test bundle in its own step, so a split run's parts
      # start with the build done. The test step's own build is then an up-to-date no-op.
      - name: Build tests
        run: npx hereby tests --bundle=true
      - name: Tests
        id: test
        if: ${{ !inputs.split }}
        env:
          BUNDLE: 'true'
        run: npm run test -- --no-lint --bundle="$BUNDLE"
      - name: Tests (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@310d103be21c9530234e76f790d448f5c42e9b83 # v1.0.6
        with:
          tool: command
          # On failure, print the baseline diff into the part's log (the part's files don't come back).
          run: npx hereby runtests-parallel --light=false --no-lint --bundle=true --shards="$VITKO_PARTS" --shardId="$VITKO_PART" || { git diff --no-index --stat tests/baselines/reference tests/baselines/local; git diff --no-index tests/baselines/reference tests/baselines/local | head -400; exit 1; }
