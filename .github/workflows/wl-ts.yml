# Workload "ts": microsoft/TypeScript@v6.0.3 (050880ce59e30b356b686bd3144efe24f875ebc8)
# Adapted from upstream .github/workflows/ci.yml, job "Test Node 24 on ubuntu-latest". Changes from upstream are marked "PORTABILITY" and are
# identical for every provider. See suite/ts/README.md.
name: wl-ts
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: runs-on label of the provider under test
        type: string
        required: true
      tag:
        description: run identifier assigned by the harness (shown as the run name)
        type: string
        required: true
      split:
        description: Track B only - run the test step through vitko-inc/split-tests (on other runners it runs all tests in one part)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    name: TypeScript test (Node 24)
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    steps:
      - name: rb-probe
        shell: bash
        run: |
          echo "rb-probe cpu=\"$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)\" nproc=$(nproc) mem_kib=$(awk '/MemTotal/{print $2}' /proc/meminfo) swap_kib=$(awk '/SwapTotal/{print $2}' /proc/meminfo) kernel=$(uname -r)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: 050880ce59e30b356b686bd3144efe24f875ebc8 # v6.0.3
          persist-credentials: false
      - name: Use node version 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          check-latest: true
      - run: npm ci
      # PORTABILITY (all providers): build the test bundle in its own step, so a split run's parts
      # start with the build done. The test step's own build is then an up-to-date no-op.
      - name: Build tests
        run: npx hereby tests --bundle=true
      - name: Tests
        id: test
        if: ${{ !inputs.split }}
        env:
          BUNDLE: 'true'
        run: npm run test -- --no-lint --bundle="$BUNDLE"
      - name: Tests (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@f0506956caffeaba87a2e3ea04e8bc06318b6af1 # v1
        with:
          tool: command
          run: npx hereby runtests-parallel --light=false --no-lint --bundle=true --shards="$VITKO_PARTS" --shardId="$VITKO_PART"
