# Workload "vue": vuejs/core@v3.5.43 (5be58b4c475c1d14b4abacbfeda610394a0ee4e5)
# Adapted from upstream .github/workflows/test.yml, job "unit-test". Changes from upstream are marked "PORTABILITY" and are
# identical for every provider. See suite/vue/README.md.
name: wl-vue
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: runs-on label of the provider under test
        type: string
        required: true
      tag:
        description: run identifier assigned by the harness (shown as the run name)
        type: string
        required: true
      split:
        description: Track B only - run the test step through vitko-inc/split-tests (on other runners it runs all tests in one part)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit-test:
    name: vue unit-test
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: rb-probe
        shell: bash
        run: |
          echo "rb-probe cpu=\"$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)\" nproc=$(nproc) mem_kib=$(awk '/MemTotal/{print $2}' /proc/meminfo) swap_kib=$(awk '/SwapTotal/{print $2}' /proc/meminfo) kernel=$(uname -r)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vuejs/core
          ref: 5be58b4c475c1d14b4abacbfeda610394a0ee4e5 # v3.5.43
          persist-credentials: false
      # PORTABILITY: set up Node before pnpm, so pnpm's installer never runs on a runner image's
      # own (possibly older) Node. The second setup-node call is upstream's (with the pnpm cache).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run unit tests
        if: ${{ !inputs.split }}
        run: pnpm run test-unit
      - name: Run unit tests (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@f0506956caffeaba87a2e3ea04e8bc06318b6af1 # v1
        with:
          run: pnpm exec vitest run --project unit
