# Workload "vite": vitejs/vite@v8.3.1 (39ddf7ccf7e7469ff6a3ba37bca38c32ea804d6e)
# Adapted from upstream .github/workflows/ci.yml, job "Build&Test: node-24, ubuntu-latest". Changes from upstream are marked "PORTABILITY" and are
# identical for every provider. See suite/vite/README.md.
name: wl-vite
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: runs-on label of the provider under test
        type: string
        required: true
      tag:
        description: run identifier assigned by the harness (shown as the run name)
        type: string
        required: true
      split:
        description: Track B only - run the test step through vitko-inc/split-tests (on other runners it runs all tests in one part)
        type: boolean
        default: false
      checkpoint:
        description: Track B only - add the checkpoint step (warm starts) after the setup steps
        type: boolean
        default: false
      accel:
        description: Provider-recommended accelerator to enable (for example runson, blacksmith); empty for none
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    name: 'vite Build&Test (node 24)'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 40
    steps:
      - name: rb-probe
        shell: bash
        run: |
          m=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
          case "$m" in *EPYC*) fam="AMD EPYC";; *Ryzen*) fam="AMD Ryzen";; *Xeon*|*XEON*) fam="Intel Xeon";; *Intel*) fam="Intel";; *AMD*) fam="AMD";; *) fam="other";; esac
          ghz=$(awk -F: '/cpu MHz/{printf "%.1f", $2/1000; exit}' /proc/cpuinfo)
          echo "rb-probe cpu=\"$fam\" ghz=${ghz:-unknown} nproc=$(nproc) mem_kib=$(awk '/MemTotal/{print $2}' /proc/meminfo) swap_kib=$(awk '/SwapTotal/{print $2}' /proc/meminfo)"
      # Provider accelerator (RunsOn): its documented S3-backed cache sidecar. Runs only when asked.
      - name: RunsOn cache sidecar
        if: ${{ inputs.accel == 'runson' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vitejs/vite
          ref: 39ddf7ccf7e7469ff6a3ba37bca38c32ea804d6e # v8.3.1
          persist-credentials: false
      # PORTABILITY: upstream's environment-react-ssr "deps reload" test asserts the ORDER of two log
      # lines that come from racing paths (a fixed 200 ms timer vs a browser round trip), so faster
      # machines lose the race. Compare the two lines order-insensitively. Fails if the code changed.
      - name: Make the deps-reload log assertion order-insensitive
        shell: bash
        run: |
          python3 - <<'PY'
          p = "playground/environment-react-ssr/__tests__/environment-react-ssr.spec.ts"
          s = open(p).read()
          old_a = ".filter(Boolean),\n      )\n      .toStrictEqual(['react-fake-server', 'react-fake-client'])"
          new_a = ".filter(Boolean)\n          .sort(),\n      )\n      .toStrictEqual(['react-fake-client', 'react-fake-server'])"
          assert s.count(old_a) == 1, "deps-reload assertion not found; review the portability patch"
          open(p, "w").write(s.replace(old_a, new_a))
          PY
      # PORTABILITY: upstream's legacy "styles only entry" watch test reads the manifest and the
      # rebuilt CSS files after counting watcher END events (it races a second one against 100 ms,
      # a workaround for rolldown issue 10613). The number and timing of END events vary, so on
      # any machine the files are sometimes read before the rebuild has written them. Instead,
      # wait (up to 10 s) until the rebuilt files referenced by the manifest exist and contain the
      # new colour, then run upstream's assertions unchanged. Fails if the code changed.
      - name: Make the legacy watch test wait for the rebuilt files
        shell: bash
        run: |
          python3 - <<'PY'
          p = "playground/legacy/__tests__/watch/legacy-styles-only-entry-watch.spec.ts"
          s = open(p).read()
          old = "  await Promise.race([notifyRebuildComplete(watcher), setTimeout(100)])\n"
          new = old + """  for (let i = 0; i < 100; i++) {
              let done = false
              try {
                const m: any = readManifest('watch')
                done = ['style-only-entry.css', 'style-only-entry-legacy.css'].every((k) => {
                  const f = m?.[k]?.file
                  return !!f && !!findAssetFile(f.substring('assets/'.length), 'watch')?.includes('#ffb6c1')
                })
              } catch {
                done = false // a file is being rewritten; try again
              }
              if (done) break
              await setTimeout(100)
            }
          """
          assert s.count(old) == 1, "legacy watch wait not found; review the portability patch"
          open(p, "w").write(s.replace(old, new))
          PY
      # PORTABILITY: Node before pnpm (see wl-vue.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set node version to 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install deps
        run: pnpm install
      - name: Set Playwright path and Get playwright version
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV
          PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV
      - name: Cache Playwright's binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-playwright-bin-v1-${{ env.PLAYWRIGHT_VERSION }}
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          restore-keys: |
            ${{ runner.os }}-playwright-bin-v1-
      # PORTABILITY: --with-deps installs Chromium's system libraries, which GitHub's image ships
      # and a plain Ubuntu image doesn't. On GitHub's image it finds them already installed.
      - name: Install Playwright
        run: pnpm playwright install --with-deps chromium
      # Track B (warm starts): save the setup above from runs of the default branch; later jobs start
      # with it in place. On other runners, and when the input is off, nothing happens.
      - name: Checkpoint (warm starts)
        if: ${{ inputs.checkpoint }}
        uses: vitko-inc/checkpoint@8fcc0f65bf4e270f9e7de0e3a4cd9ad622723b74 # v1.0.4
      - name: Build
        run: pnpm run build
      - name: Test unit
        if: ${{ !inputs.split }}
        run: pnpm run test-unit
      - name: Test unit (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@310d103be21c9530234e76f790d448f5c42e9b83 # v1.0.6
        with:
          run: pnpm exec vitest run
      - name: Test serve
        if: ${{ !inputs.split }}
        run: pnpm run test-serve
      - name: Test serve (bundled dev)
        if: ${{ !inputs.split }}
        run: pnpm run test-serve-bundled
      - name: Test build
        if: ${{ !inputs.split }}
        run: pnpm run test-build
      # Track B (split tests): the same three end-to-end (Playwright) steps, with the same commands
      # as upstream's package.json scripts, each shared out by test file. Playwright drives local
      # playground servers in each part, and the browser is installed above, before the split.
      # Spec files whose pages load resources from the internet (assets: an image from vite.dev;
      # css and css-lightningcss: an @import of external CSS) run unsplit after each split step,
      # because the parts have no outside network. Together the two steps run every spec file.
      - name: Test serve (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@310d103be21c9530234e76f790d448f5c42e9b83 # v1.0.6
        with:
          run: pnpm exec vitest run -c vitest.config.e2e.ts --exclude './playground/assets/**' --exclude './playground/css/**' --exclude './playground/css-lightningcss/**'
          env: PLAYWRIGHT_BROWSERS_PATH
      - name: Test serve (network, unsplit)
        if: ${{ inputs.split }}
        run: pnpm exec vitest run -c vitest.config.e2e.ts --passWithNoTests playground/assets/ playground/css/ playground/css-lightningcss/__tests__/
      - name: Test serve (bundled dev) (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@310d103be21c9530234e76f790d448f5c42e9b83 # v1.0.6
        env:
          VITE_TEST_BUNDLED_DEV: "1"
        with:
          run: pnpm exec vitest run -c vitest.config.e2e.ts --exclude './playground/assets/**' --exclude './playground/css/**' --exclude './playground/css-lightningcss/**'
          env: PLAYWRIGHT_BROWSERS_PATH VITE_TEST_BUNDLED_DEV
      - name: Test serve (bundled dev) (network, unsplit)
        if: ${{ inputs.split }}
        env:
          VITE_TEST_BUNDLED_DEV: "1"
        run: pnpm exec vitest run -c vitest.config.e2e.ts --passWithNoTests playground/assets/ playground/css/ playground/css-lightningcss/__tests__/
      - name: Test build (split)
        if: ${{ inputs.split }}
        uses: vitko-inc/split-tests@310d103be21c9530234e76f790d448f5c42e9b83 # v1.0.6
        env:
          VITE_TEST_BUILD: "1"
        with:
          run: pnpm exec vitest run -c vitest.config.e2e.ts --exclude './playground/assets/**' --exclude './playground/css/**' --exclude './playground/css-lightningcss/**'
          env: PLAYWRIGHT_BROWSERS_PATH VITE_TEST_BUILD
      - name: Test build (network, unsplit)
        if: ${{ inputs.split }}
        env:
          VITE_TEST_BUILD: "1"
        run: pnpm exec vitest run -c vitest.config.e2e.ts --passWithNoTests playground/assets/ playground/css/ playground/css-lightningcss/__tests__/
